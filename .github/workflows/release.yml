---
# Started by hand (Actions > Release > Run workflow, or
# `gh workflow run release.yml -f bump=minor`): bumps the version of master,
# commits it and pushes the vX.Y.Z tag, which triggers publish.yml.
# Manual so that a new version is sent to the stores only when the previous
# one is out of review: the Chrome Web Store rejects uploads while an item is
# pending review.
name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: master
          # Pushes through branch protection, and tag pushes made with a
          # personal token trigger other workflows (GITHUB_TOKEN ones do not)
          token: ${{ secrets.BYPASS_BRANCH_RULE_PAT }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Configure Git
        run: |
          git config user.name "x71c9"
          git config user.email "108585118+x71c9@users.noreply.github.com"

      - name: Bump version and release
        env:
          BUMP_TYPE: ${{ inputs.bump }}
        run: |
          echo "Version bump: $BUMP_TYPE"
          npm version "$BUMP_TYPE" --message "chore(release): release v%s"
          VERSION="v$(node -p 'require("./package.json").version')"
          git push origin HEAD:master "$VERSION"
          echo "Released $VERSION"
